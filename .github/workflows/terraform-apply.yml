name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'live/**'

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: bash scripts/detect-changes.sh

  apply:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    environment: production  # Triggers GitHub Environment protection rules
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.detect.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init

      # Download the exact plan from PR
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.directory }}
          path: ${{ matrix.directory }}

      # Apply the exact plan (no replanning!)
      - name: Terraform Apply
        working-directory: ${{ matrix.directory }}
        run: terraform apply -input=false -auto-approve tfplan
