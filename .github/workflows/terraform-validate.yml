name: Terraform Validate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'modules/**'
      - 'live/**'
      - '.github/workflows/terraform-validate.yml'

  push:
    branches: [main]
    paths:
      - 'modules/**'

permissions:
  contents: read

jobs:
  # 1. Static Code Quality
  format-check:
    name: Format & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
        # Fails if any file needs formatting

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: |
          tflint --init
          tflint -f compact --recursive
        # Catches deprecated syntax, unused vars, naming conventions

  # 2. Security & Compliance Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: reports/
          soft_fail: false  # Hard fail on violations
          download_external_modules: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          soft_fail: false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/results.sarif

  # 3. Module-Level Validation
  validate-modules:
    name: Validate Modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/vpc
          - modules/ec2
          - modules/s3
          - modules/rds
          - modules/iam
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init (Module)
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false
        # No backend needed for pure validation

      - name: Terraform Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate -no-color

      - name: Terraform Test (if tests exist)
        working-directory: ${{ matrix.module }}
        run: terraform test || true
        # Optional: runs .tftest.hcl files

  # 4. Root Configuration Validation
  validate-live:
    name: Validate Live Configs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - live/dev/vpc
          - live/dev/compute
          - live/staging/vpc
          - live/staging/compute
          - live/prod/vpc
          - live/prod/compute
          - live/prod/storage
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Verify Variables
        working-directory: ${{ matrix.environment }}
        run: |
          # Check that required variables have tfvars or defaults
          terraform validate -no-color
          terraform plan -input=false -target=null_resource.validation 2>&1 | head -20 || true